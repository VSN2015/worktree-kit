name: npm-publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # ready for npm trusted publishing (OIDC): configure a trusted publisher for
  # this repo+workflow on npmjs.com, then delete the NPM_TOKEN secret — npm
  # will authenticate via OIDC and no token needs to exist anywhere.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Skip when this version is already on the registry
        id: check
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "worktree-kit@$v" version 2>/dev/null)" ]; then
            echo "worktree-kit@$v already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

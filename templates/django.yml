# worktrees.yml — Django template (host runner). Adjust for compose if needed.
version: 1
runner: host
hooks:
  prepare: "pip install -q -r requirements.txt"
  server: "python manage.py runserver 0.0.0.0:{port}"
isolation:
  isolated_env:
    REDIS_URL: "redis://localhost:6379/{n}"
  own_db_env:
    DATABASE_NAME: "wt_{slug}"     # settings.py must read this env var
  db_bootstrap: "python manage.py migrate"
  migration_paths: ["*/migrations"]

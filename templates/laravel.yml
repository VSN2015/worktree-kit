# worktrees.yml — Laravel template (host runner). Adjust for Sail/compose if needed.
# Note: exported env vars win over .env values, but `php artisan config:cache`
# freezes config — do not cache config in development or isolation env is ignored.
version: 1
runner: host
hooks:
  prepare: "composer install --quiet"
  server: "php artisan serve --host=0.0.0.0 --port={port}"
isolation:
  isolated_env:
    REDIS_DB: "{n}"          # queues + default redis connection
    REDIS_CACHE_DB: "{n}"    # cache store
  own_db_env:
    DB_DATABASE: "wt_{slug}"
  # Adjust DB creation for your engine (shown: mysql; postgres: createdb wt_{slug}).
  db_bootstrap: "mysql -uroot -e 'CREATE DATABASE IF NOT EXISTS wt_{slug}' 2>/dev/null; php artisan migrate --force"
  migration_paths: [database/migrations]

# worktree-kit.yml — Laravel template, compose runner: one-off `docker
# compose run` containers on your already-running stack (e.g. Sail). Host
# variant: templates/host/laravel.yml.
#
# wt only ever runs the commands declared here; hooks.server is the one key
# `wt server` requires. Template variables — usable in hook commands, env
# values, and volume names (no value may contain a space):
#   {slug} worktree dir name, lowercased    {n} stable per-worktree 1-15
#   {port} host port (set for `wt server`, empty in `wt run`)
#   {container_port} hooks.container_port   {project} primary dir name
# Exported env wins over .env values — but `php artisan config:cache`
# freezes config and the isolation env is silently ignored: do not cache
# config in development.

version: 1        # schema marker; reserved, not read today
runner: compose   # one-off containers with the worktree mounted over workdir

compose:
  service: app             # your compose service whose IMAGE runs your code
                           # (Sail's default service is "laravel.test")
  workdir: /var/www/html   # where that image expects the checkout

hooks:
  # prepare: runs before EVERY wt run / wt server — idempotent dependency self-heal.
  prepare: "composer install --quiet"
  # server: must bind 0.0.0.0 and listen on {container_port};
  # wt publishes {port}:{container_port} per worktree.
  server: "php artisan serve --host=0.0.0.0 --port={container_port}"
  container_port: 8000

# Isolation levels: shared (nothing) < isolated (isolated_env) < own_db
# (isolated_env + own_db_env, plus a one-time db_bootstrap per worktree).
# `wt server` auto-picks at least isolated, escalating to own_db when the
# worktree has files under migration_paths that the primary lacks; `wt run`
# defaults to shared. wt only EXPORTS these vars — Laravel must read them.
isolation:
  isolated_env:              # exported at --isolated and --own-db
    REDIS_DB: "{n}"          # queues + default redis connection (db 0 stays the main app's)
    REDIS_CACHE_DB: "{n}"    # cache store
    # Per-worktree TEST database — phpunit.xml pins one shared DB_DATABASE
    # for every worktree. Make config/database.php prefer this var in tests:
    #   'database' => env('APP_ENV') === 'testing'
    #       ? env('TEST_DB_DATABASE', env('DB_DATABASE', 'forge'))
    #       : env('DB_DATABASE', 'forge'),
    # Create once (mysql -hmysql -uroot -e 'CREATE DATABASE wt_<slug>_test'),
    # then run suites with: wt run --isolated php artisan test
    TEST_DB_DATABASE: "wt_{slug}_test"
  own_db_env:                # exported only at --own-db
    DB_DATABASE: "wt_{slug}"
  # db_bootstrap: creates/loads the per-worktree DB; runs once per worktree
  # (marker under .git/wt-state/, cleared by `wt reset`). The -h host is your
  # compose db service name (shown: mysql); adjust for your engine.
  db_bootstrap: "mysql -hmysql -uroot -e 'CREATE DATABASE IF NOT EXISTS wt_{slug}' 2>/dev/null; php artisan migrate --force"
  # Dirs compared against the primary to auto-escalate a server to own_db.
  migration_paths: [database/migrations]

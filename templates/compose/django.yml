# worktree-kit.yml — Django template, compose runner: one-off `docker compose
# run` containers on your already-running stack. Host variant: templates/host/django.yml.
#
# wt only ever runs the commands declared here; hooks.server is the one key
# `wt server` requires. Template variables — usable in hook commands, env
# values, and volume names (no value may contain a space):
#   {slug} worktree dir name, lowercased    {n} stable per-worktree 1-15
#   {port} host port (set for `wt server`, empty in `wt run`)
#   {container_port} hooks.container_port   {project} primary dir name

version: 1        # schema marker; reserved, not read today
runner: compose   # one-off containers with the worktree mounted over workdir

# Where `wt new <branch>` puts a new worktree. The LAST path segment becomes
# the slug — and the slug names the port, the redis db {n}, and the database.
# Keep {branch} last. Personal layouts belong in worktree-kit.local.yml.
worktrees:
  path: "{parent}/{repo}-worktrees/{branch}"
  # trunk: master     # optional; what `wt merge` merges into.
                      # Default: origin/HEAD, then main, then master.

compose:
  service: web    # your compose service whose IMAGE runs your code
  workdir: /app   # where that image expects the checkout

hooks:
  # No prepare hook: pip deps live in the image's site-packages, which
  # one-off containers reset — rebuild the image when requirements change,
  # or add a volumes: entry for a venv plus a pip-install prepare self-heal.
  # server: must bind 0.0.0.0 and listen on {container_port};
  # wt publishes {port}:{container_port} per worktree.
  server: "python manage.py runserver 0.0.0.0:{container_port}"
  container_port: 8000

# Isolation levels: shared (nothing) < isolated (isolated_env) < own_db
# (isolated_env + own_db_env, plus a one-time db_bootstrap per worktree).
# `wt server` auto-picks at least isolated, escalating to own_db when the
# worktree has files under migration_paths that the primary lacks; `wt run`
# defaults to shared. wt only EXPORTS these vars — settings.py must read them.
isolation:
  isolated_env:              # exported at --isolated and --own-db
    REDIS_URL: "redis://redis:6379/{n}"   # host = your compose redis service
    # Per-worktree TEST database — otherwise every worktree's test runner
    # fights over the same test_<name> DB. settings.py must read it:
    #   "TEST": {"NAME": os.environ.get("TEST_DATABASE_NAME", "test_myapp")}
    # Django creates/destroys it itself — no bootstrap needed. Run suites
    # with: wt run --isolated python manage.py test
    TEST_DATABASE_NAME: "wt_{slug}_test"
  own_db_env:                # exported only at --own-db
    # settings.py must read it, e.g.
    #   "NAME": os.environ.get("DATABASE_NAME", "myapp")
    DATABASE_NAME: "wt_{slug}"
  # db_bootstrap: creates/loads the per-worktree DB; runs once per worktree
  # (marker under .git/wt-state/, cleared by `wt reset`). Add a createdb for
  # engines that need the database to exist before migrate.
  db_bootstrap: "python manage.py migrate"
  # Dirs compared against the primary to auto-escalate a server to own_db.
  migration_paths: ["*/migrations"]
  # db_drop (optional): destroys the per-worktree DB. `wt rm`/`wt merge` run
  # it only when the .dbowned marker is set — i.e. this worktree's DB was
  # bootstrapped by wt, not merely adopted (db_check found one already
  # there), and `wt reset` hasn't since cleared that marker. Without this
  # key wt prints the DB name and leaves it in place. -h/-U shown for
  # postgres (host = your compose db service); adjust for your engine.
  db_drop: "psql -h db -U postgres -c 'DROP DATABASE IF EXISTS wt_{slug}'"
  # redis_flush (optional): empties this worktree's redis db on `wt rm`/`wt merge`.
  redis_flush: "redis-cli -h redis -n {n} flushdb"
